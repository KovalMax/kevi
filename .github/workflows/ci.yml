name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build, Lint, Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify workspace includes kevi-core
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps | grep -q '"name":"kevi-core"'

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test (full suite + memlock, Linux)
        if: runner.os == 'Linux'
        env:
          KEVI_INSECURE_CACHE_FALLBACK: "1"
        run: cargo test --locked --workspace --features memlock --verbose

      - name: Test (full suite, non-Linux)
        if: runner.os != 'Linux'
        env:
          KEVI_INSECURE_CACHE_FALLBACK: "1"
        run: cargo test --locked --workspace --verbose

  link-check:
    name: Docs link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v1
        with:
          # Check links in Markdown and docs; skip the target directory
          args: --verbose --no-progress '**/*.md' docs/** --exclude-path target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Do not fail the entire CI on link rot; surface as a separate job result
      - name: Continue on broken links
        if: failure()
        run: |
          echo "Link checker reported issues (non-fatal)."
          exit 0

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Code coverage (cargo-llvm-cov)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: |
          cargo llvm-cov --no-cfg-coverage --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
