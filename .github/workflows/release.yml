name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-release:
    name: Build release artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Validate stable tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "kevi"))')"
          [[ "$tag" == "v$version" ]]
      - name: Build (release)
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="-C strip=symbols" cargo build --release --workspace --locked
      - name: Prepare platform archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == macOS ]]; then
            archive="kevi-macos-${{ runner.arch }}.tar.gz"
            tar -czf "$archive" -C target/release kevi
          else
            archive="kevi-linux-${{ runner.arch }}.tar.gz"
            tar -czf "$archive" -C target/release kevi
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Install CycloneDX generator
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-cyclonedx
      - name: Generate SBOM
        if: runner.os == 'Linux'
        run: cargo cyclonedx --format json --override-filename sbom
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            kevi-*.tar.gz
            sbom.json
          if-no-files-found: error

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true
      - name: Assemble final checksums
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(kevi-*.tar.gz sbom.json)
          ((${#files[@]} >= 3))
          [[ -f sbom.json ]]
          if [[ -n "$MINISIGN_SECRET_KEY" ]]; then
            printf '%s\n' 'SIGNING CONFIGURED: signature asset accompanies SHA256SUMS.txt.' > RELEASE-SIGNATURE-STATUS.txt
          else
            printf '%s\n' 'UNSIGNED: no signing key was configured; verify SHA256SUMS.txt using a trusted distribution channel.' > RELEASE-SIGNATURE-STATUS.txt
          fi
          files+=(RELEASE-SIGNATURE-STATUS.txt)
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Detect configured signing key
        id: signing-key
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [[ -n "$MINISIGN_SECRET_KEY" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install minisign
        if: steps.signing-key.outputs.configured == 'true'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: minisign
      - name: Sign final checksum manifest when configured
        if: steps.signing-key.outputs.configured == 'true'
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          cd dist
          if [[ -n "$MINISIGN_SECRET_KEY" ]]; then
            keyfile="$(mktemp)"
            trap 'rm -f "$keyfile"' EXIT
            chmod 600 "$keyfile"
            printf '%s' "$MINISIGN_SECRET_KEY" > "$keyfile"
            minisign -S -s "$keyfile" -m SHA256SUMS.txt -x SHA256SUMS.txt.minisig
            test -s SHA256SUMS.txt.minisig
          fi
      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/kevi-*.tar.gz
            dist/sbom.json
            dist/SHA256SUMS.txt*
            dist/RELEASE-SIGNATURE-STATUS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
