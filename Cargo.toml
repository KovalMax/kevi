[package]
name = "kevi"
version = "0.4.0"
edition = "2021"
build = "build.rs"

[features]
# Optional best-effort memory locking for derived keys on Unix.
memlock = ["dep:libc"]

[dependencies]
# 🔐 Crypto
ring = "0.17.8"
argon2 = { version = "0.5", default-features = true }
secrecy = { version = "0.10.3", features = ["serde"] }
zeroize = "1.8.2"
# 🧰 Serialization
serde = { version = "1.0.228", features = ["derive"] }
ron = "0.12.1"
toml = "1.1"
serde_json = "1.0.150"
sha2 = "0.11"
hex = "0.4"
# 🔢 TOTP
totp-rs = { version = "5.7.1", default-features = true, features = ["otpauth"] }
# 🧪 CLI
clap = { version = "4.6.1", features = ["derive"] }

# 📋 Clipboard copy
copypasta = "0.10.2"
inquire = "0.9.4"

# 🌈 Terminal UI
ratatui = "0.30.0"
crossterm = "0.29.0"

# 🧪 Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"
base64 = "0.22"

# Unix-only (used behind the optional `memlock` feature)
# Mark as optional to avoid pulling on non-Unix/when a feature is disabled
libc = { version = "0.2", optional = true }

# 🔁 Async runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "fs"] }
dirs = "6.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
keyring = "4.0.1"


[dev-dependencies]
# 🧪 Testing
tempfile = "3.27"
serial_test = "3.4"
gag = "1.0.0"
assert_cmd = "2.2"
predicates = "3.1"
rand = "0.10.1"

[build-dependencies]
chrono = { version = "0.4.44", default-features = true }
